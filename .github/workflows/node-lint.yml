name: Node - Lint

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Debug - comprobar lockfile
        run: |
          echo "PWD: $(pwd)"
          ls -la
          echo "----"
          test -f package-lock.json && echo "✅ package-lock.json existe" || (echo "❌ package-lock.json NO existe" && exit 1)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint
