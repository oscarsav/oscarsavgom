name: Node - Lint

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Debug - dónde estoy y qué archivos hay
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "PWD=$(pwd)"
          echo "Contenido raíz:"
          ls -la
          echo "Buscar lockfiles:"
          find . -maxdepth 3 -name "package-lock.json" -o -name "npm-shrinkwrap.json" -o -name "yarn.lock" -o -name "package.json" -print
          echo "Comprobar package-lock.json en raíz:"
          if [ -f package-lock.json ]; then
            echo "✅ package-lock.json existe en raíz"
          else
            echo "❌ package-lock.json NO existe en raíz"
          fi

      - name: Setup Node (sin cache temporalmente)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint
