[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oscarsavgom"
version = "0.1.0"
description = "Demo Python package for GitHub Actions exercise"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "python_src"}

[tool.setuptools.packages.find]
where = ["python_src"]
